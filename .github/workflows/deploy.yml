name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Runs first so the build can take its base path and origin from Pages itself,
      # which keeps the output correct whether the site is served from a custom domain,
      # a github.io project path, or a domain root.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          # Set the ONETRUST_DOMAIN_ID repository variable to switch the consent banner on.
          # Empty means no banner script and no cookies, which is the current state.
          ONETRUST_DOMAIN_ID: ${{ vars.ONETRUST_DOMAIN_ID }}
        run: node build.mjs

      - name: Audit (link integrity, headings, labels, metadata)
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ONETRUST_DOMAIN_ID: ${{ vars.ONETRUST_DOMAIN_ID }}
        run: node audit.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
